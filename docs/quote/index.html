@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#f2f2f2;--muted:#a0a0a0;--line:#3a3a3a;--bg:#111}}

      await show(key);
    } catch {
      error.textContent = 'That password isn’t right.';
      button.disabled = false; button.textContent = 'Unlock';
      input.select();
    }
  });
})();
</script>
</body>
